<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone preview</title>
<!-- Local testing only: two phone-sized copies of the preview side by side, to see the phone layout (the bar along the
     bottom) whatever the size of the window. -->
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; background: #0b0a14; color: #ece9ff; font: 600 14px system-ui, -apple-system, sans-serif; }
header { text-align: center; padding: 14px 16px 10px; }
h1 { margin: 0 0 4px; font-size: 17px; }
header p { margin: 0; color: #a7a2cf; font-weight: 500; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; padding: 6px 16px 24px; }
figure { margin: 0; display: grid; justify-items: center; gap: 10px; }
figcaption { color: #cfcaf5; }
.phone { width: 390px; height: 800px; box-sizing: border-box; padding: 10px; border-radius: 46px; background: #1c1930; box-shadow: 0 0 0 2px #2e2a48, 0 30px 60px -24px #000; }
.phone iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 36px; background: #07060e; }
</style>
</head>
<body>
<header>
  <h1>How it looks on a phone</h1>
  <p>Both are the real app with pretend games. Tap and scroll around in either one.</p>
</header>
<div class="row" id="row">
  <figure><div class="phone"><iframe src="preview.html?seed&amp;nopicker#standings" title="Standings on a phone"></iframe></div><figcaption>Standings</figcaption></figure>
  <figure><div class="phone"><iframe src="preview.html?seed&amp;nopicker#stats" title="Stats on a phone"></iframe></div><figcaption>Stats</figcaption></figure>
</div>
<script>
/* Shrink the phones to fit a short or narrow window; the app inside keeps its phone layout. */
function fit() {
  const row = document.getElementById("row");
  const side = innerWidth >= 2 * 390 + 28 + 32;
  const s = Math.min(1, (innerHeight - 90) / 840, side ? 1 : (innerWidth - 32) / 390);
  row.style.zoom = String(Math.max(0.45, s));
}
addEventListener("resize", fit);
fit();
</script>
</body>
</html>
